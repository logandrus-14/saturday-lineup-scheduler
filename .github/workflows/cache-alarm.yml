# GitHub Actions workflow: shouts if the score cache goes stale.
# Put this file at .github/workflows/cache-alarm.yml in the scheduler repo.
#
# Needs one repository secret, the same one the other workflows use:
#   FIREBASE_SERVICE_ACCOUNT  — the whole firebase-key.json contents
#
# WHY THIS EXISTS
# ---------------
# In July 2026 the cache sat 9 days stale and every workflow run still
# reported success, because the refresh scripts exit 0 on a spent CFBD
# quota on purpose. Nothing was wrong with that choice except that the
# failure was completely silent.
#
# This job FAILS when the cache is stale at a moment it shouldn't be, and a
# failed run is the one thing GitHub emails you about without being asked.
# So the alarm rides on notifications that already exist — no email server,
# no push setup, no cost.
#
# It makes no CFBD calls, so watching never eats into the monthly quota.
name: Score cache alarm

on:
  schedule:
    # Asked for every 30 minutes right through the football day, plus one
    # quiet-week check on a Monday.
    #
    # ASKING IS NOT GETTING. GitHub does not honour tight crons on free
    # runners — measured median gap 93 minutes, worst case 210, which is
    # the entire reason live_refresh.py exists. Three checks a day meant a
    # dead scheduler could sit unnoticed for hours on the one afternoon it
    # matters. Asking every 30 minutes will not deliver every 30 minutes,
    # but it turns "three chances" into "many chances", and any one of them
    # raises the alarm.
    #
    # This is the BEST-EFFORT half of the safety net. The half that does
    # not depend on GitHub at all is in the app itself: it checks how old
    # the scores it is showing are and tells the person looking at them —
    # see scoresLookBehind in lib/core/utils/slate_freshness.dart.
    - cron: '*/30 14-23 * * 4,5,6,0'    # Thu-Sun, through the football day
    - cron: '*/30 0-6 * * 5,6,0,1'      # and past midnight UTC
    - cron: '20 16 * * 1'               # Monday, catches a quiet-week death
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check cache freshness
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: python3 cache_alarm.py
