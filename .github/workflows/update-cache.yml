# GitHub Actions workflow: refreshes the Saturday Lineup score cache.
# Put this file at .github/workflows/update-cache.yml in the scheduler repo.
#
# Add two repository secrets (Settings → Secrets and variables → Actions):
#   FIREBASE_SERVICE_ACCOUNT  — paste the whole firebase-key.json contents
#   CFBD_API_KEY              — your CollegeFootballData API key
#   APNS_KEY_P8               — the .p8 Live Activity push key (optional;
#                               without it the lock-screen cards simply
#                               do not update, and nothing else changes)
name: Update score cache

on:
  schedule:
    # Every 5 minutes (GitHub's minimum). Times can drift a few minutes under
    # load — that's fine; the app tolerates a stale cache and falls back to
    # CFBD if it ever gets too old.
    - cron: '*/5 * * * *'
  workflow_dispatch: {}   # lets you run it by hand from the Actions tab

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh cache
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          APNS_KEY_P8: ${{ secrets.APNS_KEY_P8 }}
          # Line-move and kickoff notifications are OFF until they have met a
          # real Saturday. Uncomment one to turn that path on — and do it in
          # live-refresh.yml as well. Both jobs send, so a flag set in one
          # place only works on the days that job happens to run.
          # NOTIFY_LINE_MOVES: '1'
          # NOTIFY_KICKOFFS: '1'
          # Uncomment in BOTH workflows once most testers are on a build
          # that knows about the preseason. Turning it on makes week 1
          # Labor Day ONLY — anybody still on an older build loses the
          # Aug 29 games from their slate the moment it flips.
          # SPLIT_OPENING_WEEK: '1'
        run: python3 update_cache.py
