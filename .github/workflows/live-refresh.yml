# GitHub Actions workflow: keeps scores fresh while games are on.
# Put this file at .github/workflows/live-refresh.yml in the scheduler repo.
#
# Uses the same two repository secrets as update-cache.yml:
#   FIREBASE_SERVICE_ACCOUNT  — the whole firebase-key.json contents
#   CFBD_API_KEY              — your CollegeFootballData API key
#   APNS_KEY_P8               — the .p8 Live Activity push key (optional;
#                               without it the lock-screen cards simply
#                               do not update, and nothing else changes)
#
# WHY THIS EXISTS
# ---------------
# update-cache.yml asks for a run every 5 minutes. GitHub does not honour
# that on free runners: measured across 30 consecutive runs in July 2026,
# the real gap was a median of 93 minutes and as much as 210. Scores that
# old make a live board pointless.
#
# A scheduled run is a request. A job that is already running is not. So
# this starts a job a few times a day and lets it stay awake, refreshing
# every 60 seconds from the inside. GitHub's delay then only decides when
# the shift starts, not how fresh the scores are once it is going.
#
# The script ends the shift early as soon as every game is final, so this
# costs nothing overnight.
name: Live score refresh

on:
  schedule:
    # Several attempts across the football day, in UTC. Games run roughly
    # 16:00 UTC (noon ET) through 06:00 UTC. Each of these only needs ONE
    # to actually land — the job then covers hours on its own — so they
    # overlap deliberately, because most will be delayed or dropped.
    #
    # ⚠️ MONDAY IS IN THE FIRST LINE BECAUSE OF MONDAY NIGHT FOOTBALL. Cron
    # days are 0=Sun..6=Sat. This used to read `4,5,6,0` — Thu/Fri/Sat/Sun —
    # and the only Monday was in the second line at 01:00/03:00 UTC, which is
    # SUNDAY EVENING Mountain and exists to catch Sunday night games spilling
    # past midnight UTC. It was never Monday cover.
    #
    # Week 1 2026 ends with SMU at Florida State, Mon Sep 7, 23:30 UTC. Under
    # the old schedule the last shift before it started at 03:00 UTC — twenty
    # hours earlier, and a shift lasts five and a half — and the next was
    # Thursday. That game would have had no live scores, no reveals and no
    # final notifications at all. Found on Aug 31 while checking the week 1
    # slate against the schedule, not by anybody watching it fail.
    #
    # **A season has a Monday night game most weeks**, so this is a missing
    # day rather than a Labor Day special case — which is why the day is
    # added instead of dispatching a run by hand that week.
    - cron: '0 15,17,19,21,23 * * 1,4,5,6,0'  # Mon/Thu/Fri/Sat/Sun
    # Tuesday (2) is here for the same game: a 23:30 UTC Monday kickoff runs
    # to roughly 03:00 UTC Tuesday, and GitHub delays these by up to an hour,
    # so the Monday 23:00 start cannot be relied on to still be inside its
    # shift at the whistle.
    - cron: '0 1,3 * * 5,6,0,1,2'             # after midnight UTC
  workflow_dispatch: {}   # run one by hand from the Actions tab

# Never run two shifts at once — they would both write the same cache and
# double the CFBD spend for no benefit. A second trigger simply waits.
concurrency:
  group: live-score-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Below GitHub's 6h hard cap, so the script finishes on its own terms
    # rather than being killed part-way through a write.
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh scores while games are live
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          APNS_KEY_P8: ${{ secrets.APNS_KEY_P8 }}
          # ⚠️ KICKOFF ALERTS ARE ON, LINE MOVES ARE NOT — Sep 2 2026.
          #
          # Both were held off until they had met a real Saturday. Opening
          # weekend was that Saturday, so the reason for holding kickoffs
          # has expired: it is the moment this app is built around, and it
          # had always happened silently. Logan asked for it in build 36.
          #
          # Turned on in BOTH jobs, which is the trap this comment has
          # always carried: each sends, so a flag set in one place only
          # works on the days that job happens to run.
          #
          # Before switching it on, notify_kickoffs gained a per-PERSON
          # per-game cap. Its de-dupe names the group, which is right for
          # the event and wrong for the phone — somebody in four groups got
          # four near-identical pushes for one kickoff, and a seven-pick
          # Saturday would have been twenty-eight.
          #
          # LINE MOVES STAY OFF. It has still never met a live Saturday,
          # and it is the noisier of the two by far — a line that moves
          # half a point is not news, and this is exactly the path the flag
          # was invented to hold back.
          # NOTIFY_LINE_MOVES: '1'
          NOTIFY_KICKOFFS: '1'
          # ON since Aug 20 2026, once build 19 was approved and out.
          # Week 1 is Labor Day ONLY from here; the preseason is its own
          # slate. Anybody still on a build that predates the preseason
          # sees a Sep-only week 1 — that was the trade, taken knowingly.
          SPLIT_OPENING_WEEK: '1'
        run: python3 live_refresh.py
