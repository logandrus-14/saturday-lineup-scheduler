# GitHub Actions workflow: keeps NFL scores fresh while NFL games are on,
# for Fumbling's live win chance. Put this file at
# .github/workflows/nfl-live.yml in the scheduler repo.
#
# Needs only FIREBASE_SERVICE_ACCOUNT — ESPN takes no key.
#
# Separate from live-refresh.yml on purpose: see nfl_live.py. Each shift
# ends by itself once nothing is live or within reach, so the extra starts
# below cost nothing on days without games (and a public repo's Actions
# minutes are free).
name: NFL live refresh

# The NBA rides along (Oct 5 2026) — see nfl_live.py. Its nightly starts are
# the last two crons.

on:
  schedule:
    # Sunday, UTC: London games (13:30Z), the 1pm and 4pm ET windows, and
    # Sunday night — which runs past midnight UTC into Monday.
    - cron: '0 13,15,17,19,21,23 * * 0'
    - cron: '0 1,3 * * 1'
    # Monday and Thursday night (00:15Z the next UTC day), and the late
    # season's Saturday games.
    - cron: '0 23 * * 1,4'
    - cron: '0 1,3 * * 2,5'
    - cron: '0 17,19,21,23 * * 6'
    # Every evening, twice an hour, 6pm–1am ET — the NBA's nights and the
    # NFL's prime-time games. Oct 5 2026: the one 22:00Z start GitHub was
    # given didn't run until 02:05Z, and Monday night's scores sat still
    # for two hours. GitHub delays and drops scheduled runs, worst on the
    # hour, so these are off the hour and plentiful: a start that finds a
    # shift already running waits its turn (concurrency, below) and ends at
    # once if there is nothing left to watch.
    - cron: '17,47 22,23 * * *'
    - cron: '17,47 0,1,2,3,4 * * *'
  workflow_dispatch: {}

concurrency:
  group: nfl-live-refresh
  cancel-in-progress: false

# To start the next shift (below). A run started by the workflow's own
# token with workflow_dispatch is one of the few GitHub DOES run promptly.
permissions:
  actions: write
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Past the shift's own 5½ hours (MAX_SHIFT), so it always ends itself
    # and hands over — a run GitHub cuts off can't.
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh NFL and NBA scores while games are live
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        id: shift
        run: python3 nfl_live.py
      # Each shift hands over to the next — see nfl_live.py. Only after a
      # clean shift, so a crash can't spin up a run every few seconds.
      - name: Start the next shift
        if: steps.shift.outputs.chain == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run nfl-live.yml --ref "${{ github.ref_name }}"
